<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 8.1</title>
    <script src="https://d3js.org/d3.v7.min.js"></script> <!-- Load D3.js Library -->
    <link rel="stylesheet" href="style.css"> <!-- Link to external CSS file -->
</head>
<body>

    <header>
        <h1>Lab 8.1</h1>
        <nav>
            <ul>
                <li><a href="Lab_8.1.html">Lab 8.1</a></li>
                <li><a href="Lab_8.2.html">Lab 8.2</a></li>
            </ul>
        </nav>
    </header>

    <script>
        const width = 800, height = 600;
        
        // SVG canvas setup
        const svg = d3.select('body').append('svg')
                      .attr('width', width)
                      .attr('height', height);

        // Load GeoJSON data
        d3.json('LGA_VIC.json').then(geoData => {
            // Get bounds and adjust projection
            const bounds = d3.geoBounds(geoData);
            const center = [(bounds[0][0] + bounds[1][0]) / 2, (bounds[0][1] + bounds[1][1]) / 2];

            const projection = d3.geoMercator()
                                 .center(center)
                                 .scale(6000)  // Adjust scale as needed
                                 .translate([width / 2, height / 2]);

            const path = d3.geoPath().projection(projection);

            // Draw paths for each LGA
            svg.selectAll('path')
               .data(geoData.features)
               .enter()
               .append('path')
               .attr('d', path)
               .attr('stroke', 'black')
               .attr('fill', 'lightblue');  // Temporary fill to ensure visibility
        }).catch(error => console.error('Error loading the GeoJSON file:', error));
    </script>
</body>
</html>
